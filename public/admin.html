<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="dark light">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16' shape-rendering='crispEdges'%3E%3Crect width='16' height='16' fill='%23e5484d'/%3E%3Crect x='3' y='6' width='4' height='3' fill='%23fff'/%3E%3Crect x='9' y='6' width='4' height='3' fill='%23fff'/%3E%3C/svg%3E">
<link rel="preload" href="/fonts/geist-vf.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@phosphor-icons/web@2.1.1/src/regular/style.css">
<link rel="stylesheet" href="/site.css">
<title>Admin - HeroCount</title>
<meta name="robots" content="noindex">
<style>
.a-wrap{padding:48px 0 88px}
.a-wrap h1{font:600 clamp(30px,4.6vw,48px)/1.05 "Geist",sans-serif;letter-spacing:-.035em;margin:0 0 20px}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:end}
.row input{background:var(--bg);border:var(--px) solid var(--line);color:var(--text);font:500 15px/1.2 "Geist Mono",monospace;padding:13px 12px;min-width:min(100%,380px)}

.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:14px;margin:26px 0 0;max-width:520px}
.kpi{padding:18px;background:var(--panel);border:var(--px) solid var(--line)}
.kpi b{display:block;font:600 34px/1.05 "Geist",sans-serif;letter-spacing:-.03em}.kpi span{color:var(--mute);font-size:13px}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{text-align:left;padding:10px 12px;border-bottom:var(--px) solid var(--line)}th{color:var(--mute);font-weight:600}
.cols{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:22px}
.p{padding:18px;background:var(--panel);border:var(--px) solid var(--line);overflow:auto}
.p h2{font:600 16px/1.2 "Geist",sans-serif;margin:0 0 10px;max-width:none;letter-spacing:0}
@media (max-width:860px){.cols{grid-template-columns:1fr}}
</style>
</head>
<body>
<header class="nav">
  <div class="wrap">
    <a class="logo" href="/" aria-label="HeroCount home">Hero<b>Count</b></a>
    <nav aria-label="Primary">
      <a href="/#make">Make yours</a>
      <a href="/#heroes">Heroes</a>
      <a href="/docs">Docs</a>
      <a href="/dashboard">Dashboard</a>
      <a href="/integrations">Integrations</a>
      <a href="/pricing">Pricing</a>
      <a class="gh" href="https://github.com/kevish-dev/marvel-counter"><i class="ph ph-github-logo" aria-hidden="true"></i>Source</a>
    </nav>
  </div>
</header>
<main><div class="wrap a-wrap">
  <h1>Admin</h1>
  <form class="row" id="f" autocomplete="off"><div><label class="t" for="tok">Admin token</label><input id="tok" type="password" placeholder="ADMIN_TOKEN"></div><button class="btn" type="submit">Load</button></form>
  <div class="status" id="st" role="status" aria-live="polite" style="min-height:1.5em;margin-top:12px;font-size:14px"></div>
  <div id="out" hidden>
    <div class="kpis"><div class="kpi"><b id="ids">0</b><span>Counters</span></div><div class="kpi"><b id="hits">0</b><span>Counted views, all time</span></div></div>
    <div class="cols">
      <div class="p"><h2>Most viewed</h2><table><thead><tr><th>Id</th><th>Views</th></tr></thead><tbody id="top"></tbody></table></div>
      <div class="p"><h2>Newest counters</h2><table><thead><tr><th>Id</th><th>Created</th></tr></thead><tbody id="recent"></tbody></table></div>
    </div>
  </div>
</div></main>
<footer>
  <div class="wrap">
    <span>Fan-made pixel art, not affiliated with Marvel. Built by <a href="https://kevish.dev">Kevish</a>. Source-available, see <a href="https://github.com/kevish-dev/marvel-counter/blob/main/LICENSE">license</a>.</span>
    <a href="https://github.com/kevish-dev/marvel-counter">github.com/kevish-dev/marvel-counter</a>
  </div>
</footer>
<script>
const $=s=>document.querySelector(s);
const cell=(t)=>{const td=document.createElement("td");td.textContent=t;return td};
$("#tok").value=sessionStorage.getItem("hc.admin")||"";
$("#f").addEventListener("submit",async e=>{e.preventDefault();const t=$("#tok").value.trim(),st=$("#st");st.textContent="Loading...";st.style.color="";
 try{const r=await fetch("/api/admin",{headers:{authorization:"Bearer "+t}});const j=await r.json();
  if(!r.ok){$("#out").hidden=true;st.style.color="var(--err)";st.textContent=j.error||"Failed.";return}
  sessionStorage.setItem("hc.admin",t);st.textContent="";$("#out").hidden=false;
  $("#ids").textContent=Number(j.ids).toLocaleString("en-US");$("#hits").textContent=Number(j.hits).toLocaleString("en-US");
  const top=$("#top");top.textContent="";for(const[id,n]of j.top){const tr=document.createElement("tr");tr.append(cell(id),cell(Number(n).toLocaleString("en-US")));top.append(tr)}
  const rc=$("#recent");rc.textContent="";for(const x of j.recent){const tr=document.createElement("tr");tr.append(cell(x.id),cell(new Date(x.at).toLocaleString()));rc.append(tr)}
 }catch{st.style.color="var(--err)";st.textContent="Network error."}});
</script>
</body>
</html>
